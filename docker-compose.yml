version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: scholarios_postgres
    environment:
      POSTGRES_USER: scholarios_user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: scholarios_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scholarios_user -d scholarios_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer
    container_name: scholarios_adminer
    ports:
      - "8080:8080"
    restart: unless-stopped
    depends_on:
      - postgres

volumes:
  postgres_data:
